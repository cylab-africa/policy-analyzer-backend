name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies (from the lock file)
        run: uv sync --frozen

      - name: Check that the code compiles
        run: uv run --frozen python -m compileall -q app main.py scripts

      - name: Run tests
        run: uv run --frozen pytest -q
