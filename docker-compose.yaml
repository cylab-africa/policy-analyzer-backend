# Backend API + Qdrant + Redis. This mirrors the production layout, where MongoDB is hosted.
#
#   docker compose up -d --build                      # MongoDB hosted elsewhere (Atlas, etc.)
#   docker compose --profile local-db up -d --build   # also run a local MongoDB
#
# Set MONGODB_CONNECTION_STRING in .env. For the bundled MongoDB see MONGO_ROOT_USERNAME in .env.example
services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: pdp-redis
    # Requires the password in REDIS_PASSWORD (from .env) when one is set; the backend reads the same value
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Published on localhost only; the backend reaches it over the Docker network
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdp-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network
    restart: always

  # Optional local MongoDB, only started with --profile local-db
  mongo:
    profiles: ["local-db"]
    image: mongo:7
    container_name: pdp-mongo
    # With both set, MongoDB requires this login (created the first time the volume is empty).
    # Leave both empty only for throwaway local use. The backend connects with the same values:
    # mongodb://USER:PASSWORD@mongo:27017/?authSource=admin
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: always

  # One-off step: the backend runs as UID 10001, but Docker creates a missing ./db_data owned by
  # root. Hand the folder to that user before the backend starts. Where the host does not support
  # changing owners (some Windows and macOS file sharing), it only prints a warning.
  db-data-permissions:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -c
      - 'chown -R 10001:10001 /app/db_data 2>/dev/null || echo "Could not change the owner of ./db_data; make sure UID 10001 can write to it."'
    volumes:
      - ./db_data:/app/db_data
    network_mode: none
    restart: "no"

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdp-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./db_data:/app/db_data
      - ./config:/app/config
      # Uploaded documents and batch reports when USE_S3=false. A named volume, which Docker
      # creates with the image's ownership, so the app's unprivileged user can write to it.
      - uploads_data:/app/uploads
    networks:
      - app-network
    depends_on:
      db-data-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: always

networks:
  app-network:
    driver: bridge
    name: pdp-backend-network

volumes:
  redis_data:
  qdrant_data:
  mongo_data:
  uploads_data:
